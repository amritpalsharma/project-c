<div class="image-cropper">
  <h2>Image Cropper</h2>
  <div class="crop-area">
    <img [src]="image" alt="Image to crop" *ngIf="image" />
  </div>
  <div class="controls">
    <input type="file" (change)="onFileChange($event)" />
    <button (click)="cropImage()">Crop Image</button>
  </div>
  <div class="cropped-image" *ngIf="croppedImage">
    <h3>Cropped Image:</h3>
    <img [src]="croppedImage" alt="Cropped Image" />
  </div>
</div>
