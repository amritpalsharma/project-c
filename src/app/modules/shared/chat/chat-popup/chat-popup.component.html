<div class="add-chat w-100">

  <div class="chat_box">
    <div class="p-3 w-100">
      <div><h4 class="text-center mb-0 title-text">{{'newMessage' | translate}}</h4></div>
      <!-- <div class="close-img" (click)="close()"></div> -->
      <div class="close-img" *ngIf='theme!="dark"'>
        <img src="../../../assets/images/carbon_close-outline-light.svg" alt="" class="" (click)="close()" />
      </div>
      <div class="close-img" *ngIf='theme=="dark"'>
        <img src="../../../assets/images/carbon_close-outline.svg" alt="" class="" (click)="close()" />
      </div>
    </div>
  
      <div class="inbox-body chat_popup_srch_color">
        <div class="text-center w-100 body-background">
          <mat-form-field class="example-chip-list inbox-wrapper bg-color-2 w-100">
            <!-- <mat-label>To:</mat-label> -->
             <!-- <span>To:</span> -->
            <mat-chip-grid #chipGrid aria-label="Fruit selection " class="messanger-selector messanger-selector-name bg-color-2 w-100 " >
              <p class="main_to_label">{{'to' | translate}}</p>
              @for (user of users; track $index) {
                <mat-chip-row (removed)="remove(user)">
               
                  <img *ngIf="!isThisClub(user.role_name)" width="50" height="50" class="img-list " src="{{user?.meta?.profile_image_path ? user?.meta?.profile_image_path :'../../../../../assets/images/default/talent-profile-default.png'}}">
                  <img *ngIf="isThisClub(user.role_name)" width="50" height="50" class="img-list " src="{{user?.current_club_logo ? 'https://api.socceryou.ch/uploads/' + user?.current_club_logo :'../../../../../assets/images/default/talent-profile-default.png'}}">
                  {{user?.first_name+' '+user?.last_name}}
                  <span  matChipRemove [attr.aria-label]="'remove ' + user" class="cancel-icon" > </span>
                </mat-chip-row>
              }
              <input
                placeholder="{{'searchUser' | translate}}" 
                #userInput
                (input)="callListApi(userInput)"
                [matAutocomplete]="auto"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputFor]="chipGrid"
              />

            </mat-chip-grid>
           
              <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)" class="listBox w-100 users-name-list">
                @for (user of filteredUsers; track user) {
                  <mat-option [value]="user" class="mb-4 select-user-name">
                    <img *ngIf="!isThisClub(user.role_name)" width="50" height="50" class="img-list " src="{{user?.meta?.profile_image_path ? user?.meta?.profile_image_path :'../../../../../assets/images/default/talent-profile-default.png'}}">
                    <img *ngIf="isThisClub(user.role_name)" width="50" height="50" class="img-list " src="{{user?.current_club_logo ? 'https://api.socceryou.ch/uploads/' + user?.current_club_logo :'../../../../../assets/images/default/talent-profile-default.png'}}">
                    {{user?.first_name+' '+user?.last_name}}
                  </mat-option>
                }
              </mat-autocomplete>
  
          </mat-form-field>
        </div>

      </div>
      
  </div>
    <div class="chat-btn">
      <button class="btn btn-success btn-sm web-create-bg w-100"(click)="startChat()"  type="button">Chat</button>
    </div>

  </div>
