<!-- message-popup.component.html -->
<div class="msg-popup-dialog p-3">
    <div class="msg-popup-close">
        <img *ngIf="theme !='dark'"
            src="../../../assets/images/close-grey-icon.png" alt="" (click)="onCancel()" />

        <img *ngIf="theme=='dark'"
            src="../../../assets/images/carbon_close-outline.svg" alt="" (click)="onCancel()" />
    </div>

    <div class="msg-popup-content p-3 pt-1">
        <div class="display-message">
            <!-- {{'youWantToUpdate' | translate}} -->
            {{'sureToAdjustYourSubscription' | translate}}
        </div>
        <div class="popup-delete-btn d-flex align-items-center justify-content-between mx-5 px-5 py-2">
            <!-- <div (click)="onConfirm()">{{'confirm' | translate}}</div> -->
            <!-- <div (click)="onCancel()">{{'close' | translate}}</div> -->
            <div (click)="onCancel()" class="btn btn-danger bg-dark-btn btn_cancell">{{ 'close' | translate }}</div>
            <div (click)="onConfirm()" class="btn btn-success me-sm-3 bg-light-btn btn_confirmm">{{ 'buyNow' | translate }}</div>
        </div>
    </div>
</div>
