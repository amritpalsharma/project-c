<div class="container p-4">
  <div class="inner_container p-4 coupon_alert_popup">
    <!-- Dialog header -->
    <div class="modal-header pb-2">
      <h5 class="modal-title" id="couponModalLabel">{{'enterCouponCode' | translate}}</h5>
      <!-- <button type="button" class="btn-close" (click)="closeDialog()"></button> -->
      <div class="close_buttons" *ngIf='theme=="light"'>
        <button class="close-btn border-0 padding-0" aria-label="Close" (click)="closeDialog()">
          <img src="../../../../assets/images/carbon_close-outline-light.svg" alt="">
        </button>
      </div>
      <div class="close_buttons" *ngIf='theme=="dark"'>
        <button class="close-btn border-0 padding-0" aria-label="Close" (click)="closeDialog()">
          <img src="../../../../assets/images/carbon_close-outline.svg" alt="">
        </button>
      </div>
    </div>

    <!-- Dialog body -->
    <div class="modal-body">
      <!-- Form field for coupon code -->
      <div class="my-2 position-relative">
        <input type="text" class="form-control p-3 coupon_input" id="couponCode" [(ngModel)]="couponCode"
          placeholder="{{'enterYourCouponCode' | translate}}" (input)="onCouponInput()" />



        <button *ngIf="!couponApplied" type="button" class="btn bg-green btn-success coupon-btn"
          [disabled]="!couponCode.trim()" (click)="applyCoupon()">
          {{ 'checkCoupon' | translate }}
        </button>

        <button *ngIf="couponApplied && !isupgradePlan" class="btn bg-green proceed-btn" (click)="proceedToCheckout()">
          {{ 'proceedToCheckout' | translate }}
        </button>
        <button *ngIf="couponApplied && isupgradePlan" class="btn bg-green proceed-btn" (click)="proceedToUpgrade()">
          {{ 'proceedToCheckout' | translate }}
        </button>
      </div>

      <!-- Display error message if coupon is invalid -->
      <div *ngIf="couponError" class="text-danger mt-2">
        {{ couponError }}
      </div>

      <!-- Display success message if coupon is valid -->
      <div *ngIf="couponSuccess" class="text-success mt-2">
        <!-- {{ couponSuccess }} -->
      </div>

      <!-- Option for users who don't have a coupon -->
      <div class="mt-3">
        <!-- <span>{{ "dont'tHaveCoupon" | translate }} </span> 
        <button class="btn btn-link coupon-btn-link p-0" (click)="noCoupon()">
          {{ "proceedToCheckout" | translate }}
        </button> -->
      </div>
    </div>

    <!-- Dialog footer -->

    <!-- <div class="modal-footer mt-1">
      <button *ngIf="!couponApplied" type="button" class="btn btn-success coupon-btn" [disabled]="!couponCode.trim()"
        (click)="applyCoupon()">
        {{ 'checkCoupon' | translate }}
      </button>

      <button *ngIf="couponApplied" class="btn btn-primary" (click)="proceedToCheckout()">
        {{ 'proceedToCheckout' | translate }}
      </button>
    </div> -->
  </div>
</div>
