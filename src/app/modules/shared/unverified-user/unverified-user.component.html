<div class="msg-popup-dialog delete_portfolio_profile_popup">
    <div class="msg-popup-close">
        <img src="../../../assets/images/carbon_close-outline-light.svg" alt="" class="" (click)="close()" />
    </div>
    <div class="msg-popup-content px-3">
        <div class="display-message">
            <span *ngIf="isLoading">{{'accountVerificationPending' | translate }}</span>
            <span *ngIf="!isLoading">{{'pleaseWait' | translate }}</span>
        </div>
        <div class="popup-delete-btn d-flex align-items-center justify-content-center py-2">
            <div class="btn btn-danger bg-dark-btn" (click)="close()">{{ 'close' | translate }}</div>
        </div>
    </div>
</div>
