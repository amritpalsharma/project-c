<img #image [src]="base64Image" alt="Image to crop" />

<!-- Preview and crop button -->
<div class="img-preview" style="width: 150px; height: 150px; overflow: hidden;"></div>

<button (click)="cropImage()">Crop</button>

<!-- Cropped result -->
<img *ngIf="croppedImage" [src]="croppedImage" alt="Cropped Preview" />
