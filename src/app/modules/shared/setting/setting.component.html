<div class="page-content">
  <div class="main-wrapper mt-2">
    <h4 class="setting-title  mb-2">{{'accountSettings' | translate}}</h4>
    <div class="row">
      <div class="col-lg-3">
        <div class="card border-0 p-0 card-account-setting">
          <div class="card-body card-tabs settings-tabs">
            <ul class="nav nav-tabs p-0 " id="myTab" role="tablist">

              <li class="nav-item" role="presentation">
                <button class="nav-link d-flex align-items-center" [ngClass]="{'active': tab === 'activity'}"
                  id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab"
                  aria-controls="profile-tab-pane" [attr.aria-selected]="tab === 'activity'"
                  (click)="switchTab('activity')">
                  <svg id="users-icon" class="me-1 activity" width="20" height="25" viewBox="0 0 16 14" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M14.3333 7H11.6667L9.66667 13L5.66667 1L3.66667 7H1" stroke="#9D9EA0" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  {{'activityLog' | translate}}
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link d-flex align-items-center" [ngClass]="{'active': tab === 'setting'}"
                  id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings-tab-pane" type="button" role="tab"
                  aria-controls="settings-tab-pane" [attr.aria-selected]="tab === 'setting'"
                  (click)="switchTab('setting')">

                    xmlns="http://www.w3.org/2000/svg">

                      fill="#111418" fill-opacity="0.5" />
                  </svg>

                  {{'appSettings'|translate }}
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link d-flex align-items-center" [ngClass]="{'active': tab === 'notifications'}"
                  id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab"
                  aria-controls="profile-tab-pane" [attr.aria-selected]="tab === 'notifications'"
                  (click)="switchTab('notifications')">

                    xmlns="http://www.w3.org/2000/svg">
                    <path

                      fill="#111418" fill-opacity="0.5" />
                    <path
                      d="M15.0009 28.5665C15.5259 28.5544 16.0296 28.3571 16.4231 28.0094C16.8165 27.6616 17.0744 27.186 17.1509 26.6665H12.7676C12.8463 27.2001 13.1162 27.6869 13.527 28.0364C13.9378 28.3859 14.4616 28.5743 15.0009 28.5665Z"
                      fill="#111418" fill-opacity="0.5" />
                  </svg>
                  {{'notification' | translate}}
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <div class="col-lg-9">
        <div class="tab-content" id="myTabContent">
          <app-activity-log id="activity-log" *ngIf="tab === 'activity'"></app-activity-log>
          <app-app-setting id="app-settings" *ngIf="tab === 'setting'"> </app-app-setting>
          <app-notifications-log id="notifications-log" *ngIf="tab === 'notifications'"></app-notifications-log>
        </div>
      </div>
    </div>

  </div>
  <!-- Modal -->
</div>
