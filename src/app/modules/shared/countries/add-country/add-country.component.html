<div class="add-country-popup container border-0 rounded p-0">
  <div class="personal_edit p-3 popup_header">
    <div class="dialog-header m-auto">
      <h2>{{'countrySelectionConfirmation' | translate}}</h2>
    </div>
    <div class="close_buttons" *ngIf='theme!="dark"'>
      <button class="close-btn border-0 padding-0" aria-label="Close" (click)="dialogRef.close()">
        <img src="../../../../../assets/images/carbon_close-outline-light.svg" alt="">
      </button>
    </div>
    <div class="close_buttons" *ngIf='theme=="dark"'>
      <button class="close-btn border-0 padding-0" aria-label="Close" (click)="dialogRef.close()">
        <img src="../../../../../assets/images/carbon_close-outline.svg" alt="">
      </button>
    </div>
  </div>
  <!-- <hr> -->
  <div class="country-plan popup__body">
    <div class="subscription-type">
      <div class="mb-4 title_para_text">{{'addCountryText' | translate}}<br /><br />
        {{ 'doYouWantToaddPackage' | translate: { package_name: country.package_name } }}</div>
      <h2 class="mb-3">{{'subscriptionType' | translate}}</h2>
      <div class="form-check p-0">
        <input id="radio-1" class="form-check-input radio-custom" type="radio" name="isYearly" [value]="false"
          [(ngModel)]="isYearly" (change)="toggleBillingPlan(false)">
        <label for="radio-1" class="form-check-label radio-custom-label text-lowercase">{{'monthly' |
          translate}}</label>
      </div>
      <div class="form-check p-0">
        <input id="radio-2" class="form-check-input radio-custom" type="radio" name="isYearly" [value]="true"
          [(ngModel)]="isYearly" (change)="toggleBillingPlan(true)">
        <label for="radio-2" class="form-check-label radio-custom-label text-lowercase">{{'yearly' | translate}}</label>
      </div>
    </div>
    <div class="subscription-type voucher_type mt-4">
      <h2 class="mb-3">
        <button type="button" (click)="editPlanPopup()">{{'doYouHaveAVoucherCode'|
          translate}}
        </button>
      </h2>
    </div>
  </div>
  <div class="p-3 popup_footer">
    <div class="actions d-flex justify-content-between">
      <button class="btn action-cancel" (click)="dialogRef.close()">{{'cancel' | translate}}</button>
      <!-- <button class="confirm-button" (click)="onConfirm()">
        {{'buyNow' | translate}}
        <span *ngIf="countryPlanPrice && countryPlanPrice != ''">{{countryPlanPrice}}</span>
      </button>  -->
      <!-- <button class="btn buy-btn d-flex align-items-center gap-5 buy-button-wrapper" (click)="onConfirm()">
        <div class="buy-button">
          <h4>
            {{ countryPlanPrice }}
            -{{ selectedPlan?.currency }}/{{ isYearly ? ('year' | translate ) : ('month' | translate) }}
          </h4>
          <p>{{'total' | translate}}</p>
          <span>{{'buyNow' | translate}} <i class="fa-solid fa-angle-right"></i></span>
        </div>
      </button> -->
      <button class="btn buy-btn d-flex align-items-center gap-5" (click)="onConfirm()">
        <div class="buy-button">
          <h4>{{ countryPlanPrice }}.- {{ currency }} / {{ isYearly ? ('year' | translate ) : ('month' | translate) }}
          </h4>
          <!-- <p>{{'total' | translate}}</p> -->
        </div>
        <span>{{'buyNow' | translate}} <i class="fa-solid fa-angle-right"></i></span>
      </button>

    </div>
  </div>
