<div class="container">
  <div class="row">
    <!-- Right column: Form for editing player details -->
    <div class="col-md-12 p-0">
      <div class="personal_edit popup_header p-3">
        <div class="dialog-header m-auto">
          <h2>{{'editStatistic' | translate}}</h2>
        </div>

        <!-- <div class="close_buttons">
          <button class="close-btn" (click)="onCancel()">X</button>
          </div> -->

        <div class="close_buttons" *ngIf='theme!="dark"'>
          <button class="close-btn border-0 padding-0" aria-label="Close" (click)="onCancel()">
            <img src="../../../../assets/images/carbon_close-outline-light.svg" alt="">
          </button>
        </div>
        <div class="close_buttons" *ngIf='theme=="dark"'>
          <button class="close-btn border-0 padding-0" aria-label="Close" (click)="onCancel()">
            <!-- <img src="../../../../../assets/images/carbon_close-outline.svg" alt=""> -->
            <img src="../../../../assets/images/carbon_close-outline.svg" alt="">
          </button>
        </div>
      </div>

      <form class="popup__body general_form pt-3" #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
        <div class="overflow-card">
          <div class="row">
            <div class="form-group col-lg-6">
              <label for="team" class="form-label">{{'team' | translate}}</label>

              <div style="position: relative;">
                <input type="text" id="currentTeam" name="currentTeam" placeholder="{{ 'typeToSearch' | translate }}"
                  [(ngModel)]="currentTeam" #currentTeamsField="ngModel" (input)="onSearchTeams()" autocomplete="off"
                  required />
              </div>

              <!-- Club suggestions -->
              <ul *ngIf="filterTeams.length > 0 && currentTeam.length >= 2" class="suggestions-list">
                <li *ngFor="let team of filterTeams" (click)="onSelectTeam(team)">
                  {{ team.team_name }} - {{ team.team_type }}
                </li>
              </ul>
            </div>
            <div class="form-group col-lg-6">
              <label for="matches" class="form-label">{{'matches' | translate}}</label>
              <input type="number" id="matches" name="matches" [(ngModel)]="performance.matches" required>
            </div>
          </div>

          <div class="row">
            <div class="form-group col-lg-6">
              <label for="goals" class="form-label">{{'goal' | translate}}</label>
              <input type="number" id="goals" name="goals" [(ngModel)]="performance.goals" required>
            </div>
            <div class="form-group col-lg-6">
              <label for="Coach" class="form-label">{{'coachDuringDebut' | translate}}</label>
              <input type="text" id="Coach" name="coach" [(ngModel)]="performance.coach" required>
            </div>
          </div>


          <div class="row">
            <div class="form-group col-lg-6">
              <label for="session" class="form-label">{{'saison' | translate}}</label>
              <input class="form-select" type="text" id="session" name="session" [(ngModel)]="performance.session"
                required>
            </div>
            <div class="form-group col-lg-6">
              <label for="player_age" class="form-label">{{'playerAge' | translate}}</label>
              <input type="text" id="player_age" name="player_age" [(ngModel)]="performance.player_age" required>
            </div>
          </div>

          <div class="row mb-3">
            <div class="form-group">
              <div class="col-lg-9 p-0">
                <label for="form-date" class="form-label">{{'form-upto' | translate}}</label>
                <div class="date-imputs d-flex align-items-center">
                  <div class="d-flex align-items-center justify-content-center position-relative date_field">
                    <input matInput id="from_date" name="from_date" [matDatepicker]="from_datepicker"
                      [formControl]="from_date" placeholder="DD.MM.YYYY" required />
                    <mat-datepicker-toggle matSuffix [for]="from_datepicker"></mat-datepicker-toggle>
                    <mat-datepicker #from_datepicker></mat-datepicker>
                  </div>
                  <div class="d-flex align-items-center justify-content-center position-relative date_field">
                    <input matInput id="to_date" name="to_date" [matDatepicker]="to_datepicker" [formControl]="to_date"
                      placeholder="DD.MM.YYYY" required />
                    <mat-datepicker-toggle matSuffix [for]="to_datepicker"></mat-datepicker-toggle>
                    <mat-datepicker #to_datepicker></mat-datepicker>
                  </div>
                </div>
              </div>
              <!-- <div class="col-lg-4 p-0">
              <input type="date" name="form-date" id="form-date">
            </div> -->
            </div>
          </div>
        </div>
        <div class="dialog-actions align-items-center d-flex justify-content-between">
          <button class="cancel-btn" type="button" (click)="onCancel()">{{'cancel' | translate}}</button>
          <button class="save-btn" type="submit">{{'save' | translate}}</button>
        </div>
      </form>
    </div>
  </div>
</div>
