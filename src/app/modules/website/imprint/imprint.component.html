<section class="website-code">
  <!-- <app-header></app-header> -->
  <div class="grey_common_banner">
    <div class="container">
      <h2 class="cookie-text">{{ banner_title }}</h2>
      <h3>Succer You Sports AG</h3>
      <div class="row">
        <div class="col-md-6 address_col">
          <div class="contact-text">
            <div class="location">
              <div class="location-image">
                <img class="dark-location" src="./assets/images/location logo.svg">
                <img class="light-location" src="./assets/images/location-light.svg">
              </div>
              <div class="location-text">
                <p>Succer You Sports AG</p>
                <p>Ida-Stäuli-Strasse 95</p>
                <p>CH-8404 Winterthur | Switzerland</p>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="contact-text">
            <div class="mail">
              <div class="location-image">
                <img class="dark-mail" src="./assets/images/website-dark.svg">
                <img class="light-mail" src="./assets/images/website-light.svg">
              </div>
              <div>
                <a class="location-text" href="https://www.socceryou.ch/">www.socceryou.ch</a>
              </div>
            </div>
            <div class="mail">
              <div class="location-image">
                <img class="dark-mail" src="./assets/images/mail logo.svg">
                <img class="light-mail" src="./assets/images/mail-light.svg">
              </div>
              <div>
                <a class="location-text" href="mailto:info&#64;socceryou.ch">info&#64;socceryou.ch</a>
                <!-- <a class="location-text" href="mailto:info@socceryou.ch">info@socceryou.ch</a> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="adsss">
      <div *ngIf="checkActive('skyscraper')  && !isLoading" class="skyscraper-left">
        <a href="{{ advertisementData?.skyscraper?.redirect_url }}" target="_blank">
          <ng-container *ngIf="advertisementData?.skyscraper?.featured_type  == 'image'">
            <img [src]="advertisemnet_new_base_url + advertisementData?.skyscraper?.featured_image">
          </ng-container>
          <ng-container *ngIf="advertisementData?.skyscraper?.featured_type  == 'video'">
            <video class="auto-play-video" width="100%" height="auto" autoplay [muted]="true" playsinline preload="auto"
              loop="">
              <source [src]="advertisemnet_new_base_url + advertisementData?.skyscraper?.featured_image"
                type="video/mp4">
            </video>
          </ng-container>
        </a>
        <button *ngIf="!btnLoading" (click)="closeAd('skyscraper')" class="ad-close-button"><i
            class="fa-solid fa-xmark"></i></button>
        <div class="countdown" *ngIf="btnLoading">{{ countdown }}</div>
      </div>

      <div *ngIf="checkActive('wide_skyscraper')  && !isLoading" class="skyscraper-right">
        <a href="{{ advertisementData?.wide_skyscraper?.redirect_url }}" target="_blank">
          <ng-container *ngIf="advertisementData?.wide_skyscraper?.featured_type  == 'image'">
            <img [src]="advertisemnet_new_base_url + advertisementData?.wide_skyscraper?.featured_image">
          </ng-container>
          <ng-container *ngIf="advertisementData?.wide_skyscraper?.featured_type  == 'video'">
            <video class="auto-play-video" width="100%" height="auto" autoplay [muted]="true" playsinline preload="auto"
              loop="">
              <source [src]="advertisemnet_new_base_url + advertisementData?.wide_skyscraper?.featured_image"
                type="video/mp4">
            </video>
          </ng-container>
        </a>
        <button *ngIf="!btnLoading" (click)="closeAd('wide_skyscraper')" class="ad-close-button"><i
            class="fa-solid fa-xmark"></i></button>
        <div class="countdown" *ngIf="btnLoading">{{ countdown }}</div>
      </div>

    </div>

    <div class="imprint common_static_page">

      <div class="container content_page " [innerHTML]="page_content">


      </div>
      <div class="advertisment py_0" *ngIf="checkActive('leaderboard') || checkActive('banner')">
        <div class="container py_0">
          <div class="advertisment advirtismnt_2">
            <div *ngIf="isExists('leaderboard') && checkActive('leaderboard')  && !isLoading"
              class="leaderboard-club-image advirtismnt_2_large">
              <a href="{{ advertisementData?.leaderboard?.redirect_url }}" target="_blank">
                <ng-container *ngIf="advertisementData?.leaderboard?.featured_type  == 'image'">
                  <img [src]="advertisemnet_new_base_url + advertisementData?.leaderboard?.featured_image">
                </ng-container>
                <ng-container *ngIf="advertisementData?.leaderboard?.featured_type  == 'video'">
                  <video class="auto-play-video" width="100%" height="auto" autoplay [muted]="true" playsinline
                    preload="auto" loop="">
                    <source [src]="advertisemnet_new_base_url + advertisementData?.leaderboard?.featured_image"
                      type="video/mp4">
                  </video>
                </ng-container>
              </a>
              <button *ngIf="!btnLoading" (click)="closeAd('leaderboard')" class="ad-close-button"><i
                  class="fa-solid fa-xmark"></i></button>
              <div class="countdown" *ngIf="btnLoading">{{ countdown }}</div>
            </div>
            <div *ngIf="!isExists('leaderboard') && checkActive('banner')  && !isLoading"
              class="leaderboard-club-image advirtismnt_2_small">
              <a href="{{ advertisementData?.banner?.redirect_url }}" target="_blank">
                <ng-container *ngIf="advertisementData?.leaderboard?.featured_type  == 'image'">
                  <img [src]="advertisemnet_new_base_url + advertisementData?.leaderboard?.featured_image">
                </ng-container>
                <ng-container *ngIf="advertisementData?.leaderboard?.featured_type  == 'video'">
                  <video class="auto-play-video" width="100%" height="auto" autoplay [muted]="true" playsinline
                    preload="auto" loop="">
                    <source [src]="advertisemnet_new_base_url + advertisementData?.leaderboard?.featured_image"
                      type="video/mp4">
                  </video>
                </ng-container>
              </a>
              <button *ngIf="!btnLoading" (click)="closeAd('banner')" class="ad-close-button"><i
                  class="fa-solid fa-xmark"></i></button>
              <div class="countdown" *ngIf="btnLoading">{{ countdown }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- <app-footer></app-footer> -->
</section>
