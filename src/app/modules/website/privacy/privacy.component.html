<section class="website-code">
  <!-- <app-header></app-header> -->
  <div class="main">
    <!-- <div class="main1" style="background-image: url('{{base_url+banner_img}}');"> -->
    <div class="main1" style="background-image: url('/assets/images/banner_images/privacy_policy_banner_image.png');">
    <div class="overlay"></div>
    <div class="banner-inner py_0">
      <div class="container">
        <div class="about">
          <h2 class="privacy-text">{{banner_title}}</h2>
        </div>
      </div>
    </div>
    <div *ngIf="checkActive('skyscraper')  && !isLoading" class="skyscraper-left">
      <a href="{{advertisementData?.skyscraper?.redirect_url}}" target="_blank">
        <img [src]="advertisemnet_base_url + advertisementData?.skyscraper?.featured_image">
      </a>
      <button *ngIf="!btnLoading" (click)="closeAd('skyscraper')" class="ad-close-button"><i class="fa-solid fa-xmark"></i></button>
      <div class="countdown" *ngIf="btnLoading">{{countdown}}</div>
    </div>

    <div *ngIf="checkActive('wide_skyscraper')  && !isLoading" class="skyscraper-right">
      <a href="{{advertisementData?.wide_skyscraper?.redirect_url}}" target="_blank">
      <img [src]="advertisemnet_base_url + advertisementData?.wide_skyscraper?.featured_image">
      </a>
      <button *ngIf="!btnLoading" (click)="closeAd('wide_skyscraper')" class="ad-close-button"><i class="fa-solid fa-xmark"></i></button>
      <div class="countdown" *ngIf="btnLoading">{{countdown}}</div>
    </div>
  </div>

  <div class="privacy common_static_page">
    <div class="container content_page" [innerHTML]="page_content">
      <div class="advertisment" [ngClass]="{'hidden': !adVisible[2]}">
        <div *ngIf="adVisible[2]" class="leaderboard-image">
          <img src="./assets/images/leaderboard - 728x90.png">
          <button (click)="closeAd(2)" class="ad-close-button"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div class="advertisment py_0">
    <div class="container py_0">
      <div *ngIf="checkActive('leaderboard') || checkActive('banner')" class="advertisment advirtismnt_2">
        <div *ngIf="isExists('leaderboard') && checkActive('leaderboard')  && !isLoading" class="leaderboard-club-image advirtismnt_2_large">
          <a href="{{advertisementData?.leaderboard?.redirect_url}}" target="_blank">
          <img [src]="advertisemnet_base_url + advertisementData?.leaderboard?.featured_image">
         </a>
          <button *ngIf="!btnLoading" (click)="closeAd('leaderboard')" class="ad-close-button"><i class="fa-solid fa-xmark"></i></button>
          <div class="countdown" *ngIf="btnLoading">{{countdown}}</div>
        </div>
        <div *ngIf="!isExists('leaderboard') && checkActive('banner')  && !isLoading" class="leaderboard-club-image advirtismnt_2_small">
          <a href="{{advertisementData?.banner?.redirect_url}}" target="_blank">
          <img [src]="advertisemnet_base_url + advertisementData?.banner?.featured_image">
          </a>
          <button *ngIf="!btnLoading" (click)="closeAd('banner')" class="ad-close-button"><i class="fa-solid fa-xmark"></i></button>
          <div class="countdown" *ngIf="btnLoading">{{countdown}}</div>
        </div>
      </div>
    </div>
  </div>
  </div>
  <!-- <app-footer></app-footer> -->
</section>
