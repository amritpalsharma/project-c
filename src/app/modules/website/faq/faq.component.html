<section class="website-code faq---page">
    <!-- <app-header></app-header> -->
    <div class="main">
        <div class="overlay"></div>
        <div class="banner-inner py_0">
            <div class="container">
                <div class="about">
                    <h2 class="cookie-text">{{faq_banner_title}}</h2>
                </div>
            </div>
        </div>
        <div *ngIf="checkActive('skyscraper')  && !isLoading" class="skyscraper-left">
            <a href="{{advertisementData?.skyscraper?.redirect_url}}" target="_blank">
                <img [src]="advertisemnet_base_url + advertisementData?.skyscraper?.featured_image">
            </a>
            <button *ngIf="!btnLoading" (click)="closeAd('skyscraper')" class="ad-close-button"><i
                    class="fa-solid fa-xmark"></i></button>
            <div class="countdown" *ngIf="btnLoading">{{countdown}}</div>
        </div>

        <div *ngIf="checkActive('wide_skyscraper')  && !isLoading" class="skyscraper-right">
            <a href="{{advertisementData?.wide_skyscraper?.redirect_url}}" target="_blank">
                <img [src]="advertisemnet_base_url + advertisementData?.wide_skyscraper?.featured_image">
            </a>
            <button *ngIf="!btnLoading" (click)="closeAd('wide_skyscraper')" class="ad-close-button"><i
                    class="fa-solid fa-xmark"></i></button>
            <div class="countdown" *ngIf="btnLoading">{{countdown}}</div>
        </div>
    </div>

    <div class="faq py_0">
        <div class="container">
            <h3>{{faq_collapse_titile}}</h3>

            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" data-bs-target="#Tab1"
                        role="tab">{{faq_first_btn_txt}}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" data-bs-target="#Tab2" role="tab">{{faq_sec_btn_txt}}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" data-bs-target="#Tab3" role="tab">{{faq_third_btn_txt}}</a>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane active" id="Tab1" role="tabpanel">
                    <div class="accordion" id="accordionTalent" role="tablist" aria-multiselectable="true">
                        <div class="card" *ngFor="let section of talentSections; let i = index">
                            <div class="card-header p-0" role="tab" id="accordion_tal_{{i}}">
                                <a data-bs-toggle="collapse" data-bs-target="#accordion__tal_1" role="button"
                                    aria-controls="accordion__tal_1">
                                    {{section.title}}
                                </a>
                            </div>
                            <div id="accordion__tal_{{i}}" [ngClass]="{'collapse': true, 'show': i === 0}" role="tabpanel"
                                aria-labelledby="accordion_tal-1" data-bs-parent="#accordionTalent">
                                <div class="card-body" [innerHTML]="section.desc">

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane" id="Tab2" role="tabpanel">
                    <div class="accordion" id="accordionClub" role="tablist" aria-multiselectable="true">
                        <div class="card" *ngFor="let section of clubSections; let j = index">
                            <div class="card-header p-0" role="tab" id="accordion_club-{{j}}">
                                <a data-bs-toggle="collapse" data-bs-target="#accordion__club_1" role="button"
                                    aria-controls="accordion__club_1">
                                    {{section.title}}
                                </a>
                            </div>
                            <div id="accordion_club-{{j}}" [ngClass]="{'collapse': true, 'show': j === 0}" role="tabpanel"
                                aria-labelledby="accordion_club-1" data-bs-parent="#accordionClub">
                                <div class="card-body" [innerHTML]="section.desc">

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane" id="Tab3" role="tabpanel">
                    <div class="accordion" id="accordionScout" role="tablist" aria-multiselectable="true">
                        <div class="card" *ngFor="let section3 of scoutSections; let s = index">
                            <div class="card-header p-0" role="tab" id="accordion_scout-{{s}}">
                                <a data-bs-toggle="collapse" data-bs-target="#accordion__scout_1" role="button"
                                    aria-controls="accordion__scout_1">
                                {{section3.title}}
                                </a>
                            </div>
                            <div id="accordion_scout-{{s}}" [ngClass]="{'collapse': true, 'show': s === 0}" role="tabpanel"
                                aria-labelledby="accordion_scout-1" data-bs-parent="#accordionScout">
                                <div class="card-body" [innerHTML]="section3.desc">
                                  
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container py_0 pt-0 pb-0">
                <div *ngIf="checkActive('leaderboard') || checkActive('banner')" class="advertisment advirtismnt_2">
                    <div *ngIf="isExists('leaderboard') && checkActive('leaderboard')  && !isLoading"
                        class="leaderboard-club-image advirtismnt_2_large">
                        <a href="{{advertisementData?.leaderboard?.redirect_url}}" target="_blank"></a>
                        <img [src]="advertisemnet_base_url + advertisementData?.leaderboard?.featured_image">
                    </div>
                    <button *ngIf="!btnLoading" (click)="closeAd('leaderboard')" class="ad-close-button">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <div class="countdown" *ngIf="btnLoading">{{countdown}}</div>
                </div>
                <div *ngIf="!isExists('leaderboard') && checkActive('banner')  && !isLoading"
                    class="leaderboard-club-image advirtismnt_2_small">
                    <a href="{{advertisementData?.banner?.redirect_url}}" target="_blank">
                        <img [src]="advertisemnet_base_url + advertisementData?.banner?.featured_image">
                    </a>
                    <button *ngIf="!btnLoading" (click)="closeAd('banner')" class="ad-close-button">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <div class="countdown" *ngIf="btnLoading">{{countdown}}</div>
                </div>
            </div>
        </div>
    </div>
</section>
