<div class="dialog-container edit_genrl_details">
  <div class="personal_edit popup_header p-3">
    <div class="dialog-header mx-auto">
      <h2>{{ 'editPersonalDetails' | translate }}</h2>
    </div>
    <div class="close_buttons" *ngIf='theme!="dark"'>
      <button class="close-btn border-0 padding-0" aria-label="Close" (click)="onCancel()">
        <img src="../../../../assets/images/carbon_close-outline-light.svg" alt="">
      </button>
    </div>
    <div class="close_buttons" *ngIf='theme=="dark"'>
      <button class="close-btn border-0 padding-0" aria-label="Close" (click)="onCancel()">
        <!-- <img src="../../../../../assets/images/carbon_close-outline.svg" alt=""> -->
        <img src="../../../../assets/images/carbon_close-outline.svg" alt="">
      </button>
    </div>
  </div>

  <form class="popup__body pt-3" #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
    <div class="overflow-card">
      <div class="row">
        <!-- Club Name -->
        <div class="form-group col-lg-6">
          <label for="company_name">{{ 'company' | translate }}: </label>
          <input type="text" id="company_name" name="company_name" [(ngModel)]="company_name" required>
        </div>

        <!-- Formation Date -->
        <div class="form-group col-lg-6">
          <label for="designation">{{ 'function' | translate }}: </label>
          <input type="text" id="designation" name="designation" [(ngModel)]="designation" required>
        </div>

        <div class="form-group col-lg-12">
          <label for="address">{{ 'address' | translate }}: </label>
          <textarea id="address" name="address" [(ngModel)]="address" required></textarea>
        </div>

         <!-- Zipcode -->
        <div class="form-group col-lg-6">
          <label for="zipcode">{{ 'zipCode' | translate }}: </label>
          <input type="text" id="zipcode" name="zipcode" [(ngModel)]="zipcode" required>
        </div>

        <!-- City -->
        <div class="form-group col-lg-6">
          <label for="city">{{ 'city' | translate }}: </label>
          <input type="text" id="city" name="city" [(ngModel)]="city" required>
        </div>

        <div class="form-group col-lg-6">
          <label for="country">{{ 'country' | translate }}: </label>
          <select name="user_nationalities" [(ngModel)]="country" id="" class="cupen-btn-1 form-select">
            <option value="null" [selected]="!country || !scoutNation">{{'select' | translate}}</option>
            <option [value]="scout_country.id" *ngFor="let scout_country of this.countries"
              [selected]="scout_country.id == country">{{scout_country.country_name}}</option>
          </select>
        </div>
        <!-- Contact Number -->
        <div class="form-group col-lg-6">
          <label for="contact_number">{{ 'phone' | translate }}: </label>
          <input type="tel" id="contact_number" name="contact_number" [(ngModel)]="contact_number" required>
        </div>
        <!-- Website -->
        <div class="form-group col-lg-6">
          <label for="website">{{ 'website' | translate }}: </label>
          <input type="url" id="website" name="website" [(ngModel)]="website" required>
        </div>
      </div>
      <!-- Social media Locked View -->
      <!-- Social media Lock View -->
      <div class="row position-relative" *ngIf="!isPremium">
        <div class="social_form-box my-3 col-lg-12">
          <span class="social_heddig pe-2">{{ 'socialMedia' | translate }}&nbsp;</span>
          <span class="note_titles">{{'note' | translate}}</span>
        </div>
