<div class="msg-popup-dialog cancel_country_plan_popup p-0">
    <div class="popup_header p-3">
        <div class="dialog-header m-auto">
            <h2>{{'countryPlanCancel' | translate}}</h2>
            <div class="close_buttons" *ngIf='theme!="dark"'>
               <img src="../../../../assets/images/carbon_close-outline-light.svg" alt="" (click)="close()">
            </div>
            <div class="close_buttons" *ngIf='theme=="dark"'>
                <img src="../../../assets/images/carbon_close-outline.svg" alt="" class="" (click)="close()" />
            </div>
        </div>
        
    </div>
    <div class="popup__body msg-popup-content p-3 pt-1">
        <div *ngIf="data.countries && data.countries.length > 0">
            <div class="country-option" *ngFor="let country of data.countries">
                <label class="country-label">
                    <input type="radio" name="country" [value]="country.id" [(ngModel)]="selectedCountryId" [disabled]="country.stripe_cancel_at != null" class="country-radio" />
                    <span class="country-info">
                        {{ country.package_name }} <br class="break_for_mobile"> {{ country.price }} {{country.currency}}/{{ country.interval === 'monthly' ? ('month' | translate) : ('year' | translate) }} {{country.stripe_cancel_at != null ? ' - Cancelled' : ''}}
                    </span>
                </label>
            </div>
            <button class="confirm-btn" [disabled]="!selectedCountryId" (click)="confirmSelection()">
                {{'confirmCancellation' | translate}}
            </button>
        </div>
    </div>
</div>
