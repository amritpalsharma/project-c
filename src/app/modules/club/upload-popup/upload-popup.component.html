<div class="msg-popup-dialog">
    <div class="msg-popup-close">
        <img src="../../../assets/images/close-icon-circle.png" alt="" class="" (click)="close()" />
    </div>

    <div class="msg-popup-content">

        <div class="upload-box" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
            (drop)="onFileDropped($event)">
            <!-- <p class="upload-file_name">{{'dragAndDropFiles' | translate}}</p> -->
            <!-- <p class="upload-file_name">{{'fileSupported1' | translate}}</p> -->
            <p class="upload-file_name">{{'dragAndDropFilesHere' | translate}}</p>
            <p class="upload-file_name">{{'filesSupported' | translate}}</p>
            <input type="file" (change)="onFileSelect($event)" multiple hidden #fileInput />
            <button type="button" (click)="fileInput.click()">{{'uploadFiles' | translate}}</button>
        </div>

        <div class="file-list">
            <div *ngFor="let result of uploadResponse">
                <span>{{ result }}</span>
            </div>
        </div>
    </div>
</div>
